spring:
  application:
    name: quizchef
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: quizchef
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true
    default-schema: quizchef
    schemas: quizchef

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  structured:
    format:
      # Elastic Common Schema: a neutral, widely-parseable JSON schema with
      # no assumed backend (RFC-010). Automatically includes MDC entries
      # (correlationId, requestId, identityId, sessionId, ...) as fields.
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: QuizChef
    version: 0.1.0-SNAPSHOT

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

quizchef:
  gameplay:
    # How long a question's reading period lasts before options appear and
    # the answer timer starts. A global constant today (see GameplayProperties);
    # the natural seam to make per-quiz if a future milestone demands it.
    question-preview-seconds: 5
  security:
    jwt:
      issuer: quizchef
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      audience: ${JWT_AUDIENCE:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    max-request-size-bytes: 262144
    rate-limit:
      default-rule:
        capacity: 60
        window: PT1M
      # Map keys with spaces/slashes need bracket notation or Spring Boot's
      # relaxed binding silently strips the special characters, mangling the
      # key into something that never matches (caught by
      # RateLimitingIntegrationTest before this comment existed).
      rules:
        "[POST /api/v1/auth/login]":
          capacity: 5
          window: PT1M
        "[POST /api/v1/auth/register]":
          capacity: 3
          window: PT1M
        "[POST /api/v1/sessions]":
          capacity: 10
          window: PT1M
        # --- Participant-facing routes: sized per VENUE, not per person.
        #
        # These three are limited per client IP, and at a real event every
        # phone in the building shares one NAT address — so the per-IP limit
        # is in practice a per-venue limit. At the old numbers a measured
        # 40-device room got 10 joins, 10 reconnects, and 7 answers through;
        # everyone else was refused with a 60-second Retry-After, which at a
        # live event means most of the room simply cannot play.
        #
        # Sized from PARTICIPANT_RATE_LIMIT_CAPACITY (the largest room to
        # support). Raise it for a bigger venue; no other limit moves with
        # it, and the authentication and registration buckets below are
        # deliberately untouched.
        #
        # What this still bounds: a single address gets 150 join attempts a
        # minute. Against the 6-digit PIN space that is roughly one chance in
        # 6,700 per minute of guessing a specific live session — and a PIN is
        # on the projector in front of the room anyway. The session's own
        # maxParticipants, the lobby-state check, and one-answer-per-question
        # remain the real limits on what a guessed PIN is worth.
        "[POST /api/v1/sessions/{pin}/join]":
          capacity: ${PARTICIPANT_RATE_LIMIT_CAPACITY:150}
          window: PT1M
        # Every device reconnects right after joining (that is what marks it
        # connected), on every refresh, and after every dropped websocket —
        # so a wifi blip reconnects the whole room at once. Twice the room
        # size per minute leaves headroom for that without a second thought.
        "[POST /api/v1/sessions/reconnect]":
          capacity: ${PARTICIPANT_RECONNECT_RATE_LIMIT_CAPACITY:300}
          window: PT1M
        # A whole room answers within the same few seconds of a question
        # opening, which is the entire point of the format.
        "[POST /api/v1/sessions/{id}/answers]":
          capacity: ${PARTICIPANT_ANSWER_RATE_LIMIT_CAPACITY:200}
          window: PT10S
        "[POST /api/v1/quizzes/{quizId}/publish]":
          capacity: 10
          window: PT1M
        "[POST /api/v1/users/me/host-access]":
          capacity: 3
          window: PT1M
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
