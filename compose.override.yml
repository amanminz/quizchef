# Local development overrides, merged automatically by `docker compose up`.
# Publishes every service on the host so contributors can reach them directly.
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  minio:
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    # The browser talks to the backend directly, on the host port published
    # above — the same split-origin arrangement as production, where the two
    # are separate Railway services.
    #
    # This has to be a build arg, not an environment variable: Vite inlines
    # VITE_* at build time, so the value is baked into the bundle and a
    # container restart will not change it. Editing this needs a rebuild
    # (`docker compose up -d --build frontend`).
    #
    # Without it the bundle falls back to same-origin, and every API call
    # goes to the nginx serving the static files. nginx has no /api route,
    # so the request lands on the SPA fallback and POSTs come back
    # **405 Not Allowed** — which looks like a broken backend but never
    # reaches it. (The Vite dev server has no such problem: `npm run dev`
    # proxies /api and /ws itself, which is why this only bites in Docker.)
    #
    # CORS is already satisfied: the backend's CORS_ALLOWED_ORIGINS defaults
    # to http://localhost:${FRONTEND_PORT} in compose.yml.
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
        # Left empty deliberately: the client derives
        # ws://<api-host>/ws/websocket from the API base URL above, and one
        # source of truth is harder to get wrong than two (RFC-009).
        VITE_WS_URL: ${VITE_WS_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
