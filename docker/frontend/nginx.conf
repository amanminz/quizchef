server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single-page application: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry point must always be revalidated so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed assets, so they are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional extra routes, empty in the image and in production. Local
    # development drops an API proxy in here (see compose.override.yml) so the
    # browser and the API share one origin whatever hostname the page was
    # opened with — localhost, 127.0.0.1, a WSL address, or a LAN address
    # reached from a phone. A glob that matches nothing is not an error in
    # nginx, so production renders exactly the server block it always did.
    include /etc/nginx/site-extra/*.conf;
}
