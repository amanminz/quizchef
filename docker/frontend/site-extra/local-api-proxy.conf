# Local development only. compose.override.yml mounts this whole directory
# over /etc/nginx/site-extra/, which the server block includes; the image
# ships that directory empty, so production never sees this file.
#
# It makes the containerized frontend same-origin with its API, the way the
# Vite dev server already is (`npm run dev` proxies these same two paths).
# Without it the browser has to call the backend on another origin, which
# means CORS has to name the exact hostname the page was opened with —
# localhost, 127.0.0.1, a WSL address, or the LAN address a phone would use
# are four different origins, and only one of them can be configured at a
# time. Same-origin has no such problem, and phones on the LAN can join a
# session without any configuration at all.
#
# `backend` resolves on the Compose network. This file is never present in
# production, where the two are separate Railway services with no shared
# network and the frontend is built with an explicit VITE_API_BASE_URL.

location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    # $http_host, not $host: $host drops the port, so the backend would
    # reconstruct a different origin than the browser sent and treat a
    # same-origin POST as cross-origin — a 403 on every spelling but the
    # one the CORS allowlist happens to name.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The realtime endpoint (RFC-005) needs the upgrade handshake forwarded, and
# a long read timeout so an idle STOMP connection is not cut mid-session.
location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $http_host, not $host: $host drops the port, so the backend would
    # reconstruct a different origin than the browser sent and treat a
    # same-origin POST as cross-origin — a 403 on every spelling but the
    # one the CORS allowlist happens to name.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
